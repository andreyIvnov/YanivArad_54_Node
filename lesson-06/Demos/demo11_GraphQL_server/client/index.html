<html>
  <body>
    <button onclick="createPerson()">Add a Person</button>

    <script>
      const PERSONS_URL = 'http://localhost:4000/persons';

      async function createPerson(person) {
        const query = `
          mutation {
            createPerson(per: { id: 4, name: "John", age: 99 })
          }
        `;
        // const query = `
        //   mutation {
        //     createPerson(per: { id: ${person.id}, name: "${person.name}", age: ${person.age} })
        //   }
        // `;

        const resp = await fetch(PERSONS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });

        const data = await resp.json();

        console.log(data);
      }
    </script>
  </body>
</html>
